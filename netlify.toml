[build]
  publish = "site"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Short link for ads and texts: your-domain.com.au/apply
[[redirects]]
  from = "/apply"
  to = "/apply.html"
  status = 200

# Simplified one-page site
[[redirects]]
  from = "/simple"
  to = "/simple.html"
  status = 200

# Tracked short links for YouTube and socials. The src tag is saved with every lead.
# Say "wcofinance.com.au/yt" in videos; use /yt/<code> to measure one video on its own.
[[redirects]]
  from = "/yt"
  to = "/simple?src=youtube"
  status = 302

[[redirects]]
  from = "/yt/:code"
  to = "/simple?src=youtube-:code"
  status = 302

[[redirects]]
  from = "/short"
  to = "/simple?src=youtube-shorts"
  status = 302

[[redirects]]
  from = "/ig"
  to = "/simple?src=instagram"
  status = 302

[[redirects]]
  from = "/mj"
  to = "/simple?src=mitchjames"
  status = 302

# Book a call. Point this at your booking page (e.g. Calendly) once it exists.
[[redirects]]
  from = "/call"
  to = "/simple#contact"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    # Keep the whole site out of search engines until the employment contract review and licensing are done
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
